
# ==========================================
# Muhammad Saleh | Technical Blog
# ==========================================

theme: jekyll-theme-chirpy

lang: en
timezone: Asia/Riyadh

# ==========================================
# SEO & SITE IDENTITY
# ==========================================

title: "Muhammad Saleh"

tagline: "Cybersecurity | Infrastructure | Cloud & DevOps"

description: >-
  Explore technical articles, Hack The Box (HTB) walkthroughs,
  penetration testing, cybersecurity, Windows and Linux administration,
  enterprise infrastructure, cloud computing, AWS, virtualization,
  automation, and DevOps. Practical guides, real-world troubleshooting,
  and hands-on technical insights by Muhammad Saleh.

url: "https://blog.musalehofficial.com"
baseurl: ""

# ==========================================
# GITHUB & SOCIAL PROFILES
# ==========================================

github:
  username: "" # Add your GitHub username

twitter:
  username: "" # Optional: X username

social:
  name: "Muhammad Saleh"
  email: "" # Optional: public email
  fediverse_handle:
  links: []
  # Add your actual social URLs here, for example:
  # links:
  #   - https://github.com/YOUR_USERNAME
  #   - https://www.linkedin.com/in/YOUR_PROFILE

# ==========================================
# SEARCH ENGINE VERIFICATION
# ==========================================

webmaster_verifications:
  google: ""
  bing: ""
  alexa:
  yandex:
  baidu:
  facebook:

# ==========================================
# ANALYTICS
# ==========================================

analytics:
  google:
    id: "" # Optional: Google Analytics GA4 ID
  goatcounter:
    id:
  umami:
    id:
    domain:
  matomo:
    id:
    domain:
  cloudflare:
    id:
  fathom:
    id:

pageviews:
  provider:

# ==========================================
# APPEARANCE
# ==========================================

theme_mode: dark

cdn:

avatar: "" # Add an image later, e.g. /assets/img/avatar.png

# Default Open Graph image for shared links.
# Upload this image before enabling the setting.
social_preview_image: ""

toc: true

# ==========================================
# POST ACTIONS
# ==========================================

actions:
  edit_post:
    enabled: false
    url: ""
    static_url: false

# ==========================================
# COMMENTS
# ==========================================

comments:
  provider:

  disqus:
    shortname:

  utterances:
    repo:
    issue_term:

  giscus:
    repo:
    repo_id:
    category:
    category_id:
    mapping: pathname
    strict: 0
    input_position: bottom
    lang: en
    reactions_enabled: 1

# ==========================================
# STATIC ASSETS
# ==========================================

assets:
  self_host:
    enabled: false
    env:

# ==========================================
# PROGRESSIVE WEB APP
# ==========================================

pwa:
  enabled: true
  cache:
    enabled: true
    deny_paths: []

# ==========================================
# BLOG SETTINGS
# ==========================================

paginate: 10

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

# ==========================================
# COLLECTIONS & POST PERMALINKS
# ==========================================

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true
      permalink: /posts/:title/

  - scope:
      path: _drafts
    values:
      comments: false

  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

# ==========================================
# STYLING
# ==========================================

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

# ==========================================
# EXCLUDED BUILD FILES
# ==========================================

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

# ==========================================
# CATEGORY & TAG ARCHIVES
# ==========================================

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
