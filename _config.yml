
# ==========================================
# Muhammad Saleh | Technical Blog
# ==========================================

theme: jekyll-theme-chirpy

lang: en
timezone: Asia/Riyadh

# ==========================================
# SEO & SITE IDENTITY
# ==========================================

title: "Muhammad Saleh"

tagline: "Cybersecurity | Infrastructure | Cloud & DevOps"

description: >-
  Practical guides on cybersecurity, HTB, Windows and Linux administration,
  cloud infrastructure, AWS, virtualization, automation, and DevOps.

url: "https://blog.musalehofficial.com"
baseurl: ""

# ==========================================
# GITHUB & SOCIAL PROFILES
# ==========================================

github:
  username: "MUsalehofficial" # Add your GitHub username

twitter:
  username: "MUsalehofficial" # Optional: X username

social:
  name: "Muhammad Saleh"
  email: "hi@musalehofficial.com"
  fediverse_handle:
  links:
    - https://github.com/MUsalehofficial
    - https://twitter.com/MUsalehofficial
  # Add additional public profile URLs to this list when needed.

author:
  name: "Muhammad Saleh"
  url: "https://blog.musalehofficial.com/about/"
  twitter: "MUsalehofficial"

# ==========================================
# SEARCH ENGINE VERIFICATION
# ==========================================

webmaster_verifications:
  google:
  bing: "2508AF6C5106E960865582CD10DCB73D"
  alexa:
  yandex:
  baidu:
  facebook:

# ==========================================
# ANALYTICS
# ==========================================

analytics:
  google:
    id: "" # Optional: Google Analytics GA4 ID
  goatcounter:
    id:
  umami:
    id:
    domain:
  matomo:
    id:
    domain:
  cloudflare:
    id:
  fathom:
    id:

pageviews:
  provider:

# ==========================================
# APPEARANCE
# ==========================================

theme_mode: dark

cdn:

avatar: "" # Add an image later, e.g. /assets/img/avatar.png

# Default Open Graph image for shared links.
# Upload this image before enabling the setting.
social_preview_image: "/assets/img/site/social-preview.png"

toc: true

# ==========================================
# POST ACTIONS
# ==========================================

actions:
  edit_post:
    enabled: false
    url: ""
    static_url: false

# ==========================================
# COMMENTS
# ==========================================

comments:
  provider:

  disqus:
    shortname:

  utterances:
    repo:
    issue_term:

  giscus:
    repo:
    repo_id:
    category:
    category_id:
    mapping: pathname
    strict: 0
    input_position: bottom
    lang: en
    reactions_enabled: 1

# ==========================================
# STATIC ASSETS
# ==========================================

assets:
  self_host:
    enabled: false
    env:

# ==========================================
# PROGRESSIVE WEB APP
# ==========================================

pwa:
  enabled: true
  cache:
    enabled: true
    deny_paths: []

# ==========================================
# BLOG SETTINGS
# ==========================================

paginate: 10

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

# ==========================================
# COLLECTIONS & POST PERMALINKS
# ==========================================

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true
      permalink: /posts/:title/

  - scope:
      path: _drafts
    values:
      comments: false

  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

# ==========================================
# STYLING
# ==========================================

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

# ==========================================
# EXCLUDED BUILD FILES
# ==========================================

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

# ==========================================
# CATEGORY & TAG ARCHIVES
# ==========================================

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
